<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061316">
<title>EX™ ALJAZIRA — MAX TECH V2</title>
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="./manifest.webmanifest">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js"
  }
}
</script>
</head>
<body>
<div id="app">
<section id="menu" class="menu">
  <img src="./assets/cover-main.webp" class="cover" alt="EX ALJAZIRA">
  <div class="shade"></div>
  <div class="brand">フサム | experience™ <span>EX™ PLAYABLE WORLDS</span></div>
  <div class="menu-ui">
    <small>MAX TECH V2 // WEBGPU + WEBGL2 FALLBACK // CHUNK STREAMING</small>
    <button class="primary" data-mode="continue">CONTINUE // تابع العالم</button>
    <button data-mode="new">NEW WORLD // عالم جديد</button>
    <div class="modes">
      <button data-mode="survival">SURVIVAL</button><button data-mode="creative">CREATIVE</button><button data-mode="adventure">ADVENTURE</button><button data-mode="spectator">SPECTATOR</button><button data-mode="hardcore">HARDCORE</button>
    </div>
  </div>
</section>
<div id="root" class="hidden"></div>
<div id="hud" class="hidden">
  <div class="bars"><label>HP<i><b id="hp"></b></i></label><label>HUNGER<i><b id="hunger"></b></i></label><label>SHIELD<i><b id="shield"></b></i></label></div>
  <div class="top"><span id="mode">SURVIVAL</span><b id="objective">EXPLORE • GATHER • FORTIFY</b><span id="clock">DAY 1 • 08:00</span></div>
  <div id="crosshair">+</div><div id="hotbar"></div>
  <button id="chatBtn">CHAT</button>
</div>
<aside id="chat" class="hidden"><header>EX™ GLOBAL CHAT <button id="closeChat">×</button></header><div id="messages"></div><form id="chatForm"><input id="chatInput" maxlength="180" placeholder="اكتب رسالة..."><button>SEND</button></form></aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
